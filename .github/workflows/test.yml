name: HealQA Playwright Test Automation CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      maven_args:
        description: 'Maven test execution options (managed by HealQA Platform)'
        required: false
        default: ''
      tags:
        description: 'Cucumber Tag Filter (e.g. @Forms, @Elements)'
        required: false
        default: ''
      browser:
        description: 'Target Browser (chromium, firefox, webkit)'
        required: false
        default: 'chromium'
      headless:
        description: 'Headless Mode (true/false)'
        required: false
        default: 'true'
      healqa_api_url:
        description: 'HealQA Platform Server URL for Realtime Event Ingestion'
        required: false
        default: ''
      healqa_realtime_enabled:
        description: 'Enable Realtime Event Ingestion'
        required: false
        default: 'false'
      healqa_api_token:
        description: 'HealQA Execution API Token'
        required: false
        default: ''
      healqa_run_id:
        description: 'HealQA Run ID'
        required: false
        default: ''
      healqa_execution_id:
        description: 'HealQA Execution ID'
        required: false
        default: ''

jobs:
  test:
    name: Execute Playwright Java Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium" || npx --yes playwright install --with-deps chromium || true

      - name: Execute Playwright Tests with Embedded SDK (.repo/)
        env:
          HEALQA_API_URL: ${{ github.event.inputs.healqa_api_url || secrets.HEALQA_API_URL }}
          HEALQA_REALTIME_ENABLED: ${{ github.event.inputs.healqa_realtime_enabled || 'false' }}
          HEALQA_API_TOKEN: ${{ github.event.inputs.healqa_api_token || secrets.HEALQA_API_TOKEN }}
          HEALQA_RUN_ID: ${{ github.event.inputs.healqa_run_id || github.event.inputs.healqa_execution_id || '' }}
          HEALQA_EXECUTION_ID: ${{ github.event.inputs.healqa_execution_id || github.event.inputs.healqa_run_id || '' }}
          HEALQA_EXECUTION_SOURCE: GITHUB_ACTIONS
          MAVEN_ARGS: ${{ github.event.inputs.maven_args }}
        run: |
          rm -rf ~/.m2/repository/com/automation
          if [ -n "$MAVEN_ARGS" ]; then
            eval "mvn clean test $MAVEN_ARGS"
          else
            mvn clean test -Dengine=playwright -Dengine.type=playwright \
              -Dplaywright.headless="${{ github.event.inputs.headless || 'true' }}" \
              -Dheadless="${{ github.event.inputs.headless || 'true' }}" \
              -Dbrowser="${{ github.event.inputs.browser || 'chromium' }}" \
              ${{ github.event.inputs.tags && format('-Dcucumber.filter.tags="{0}"', github.event.inputs.tags) || '' }}
          fi

      - name: Archive Cucumber & Allure Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-evidence
          path: |
            target/cucumber-reports/
            target/screenshots/
            target/videos/
            target/element-healing-history.json
